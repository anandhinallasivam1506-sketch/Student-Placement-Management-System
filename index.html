<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Placement Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="header">
    <div>
        <h1>Student Placement Management System</h1>
        <p>Manage student placement information efficiently</p>
    </div>
</header>


<main class="container">

    <section class="card">

        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">

            <input type="hidden" id="studentId">

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter student name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="student@example.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>

                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="CSE">Computer Science and Engineering</option>
                        <option value="ECE">Electronics and Communication Engineering</option>
                        <option value="EEE">Electrical and Electronics Engineering</option>
                        <option value="MECH">Mechanical Engineering</option>
                        <option value="CIVIL">Civil Engineering</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cgpa">CGPA</label>

                    <input
                        type="number"
                        id="cgpa"
                        min="0"
                        max="10"
                        step="0.01"
                        placeholder="Enter CGPA"
                        required>
                </div>

                <div class="form-group full-width">
                    <label for="skills">Skills</label>

                    <input
                        type="text"
                        id="skills"
                        placeholder="Python, Java, SQL"
                        required>
                </div>

                <div class="form-group">
                    <label for="placementStatus">
                        Placement Status
                    </label>

                    <select id="placementStatus" required>
                        <option value="">Select Status</option>
                        <option value="Not Placed">Not Placed</option>
                        <option value="Placed">Placed</option>
                        <option value="Looking for Opportunities">
                            Looking for Opportunities
                        </option>
                    </select>
                </div>

            </div>

            <div class="button-group">

                <button type="submit" class="btn primary">
                    Save Student
                </button>

                <button
                    type="button"
                    class="btn secondary"
                    id="cancelButton"
                    onclick="resetForm()"
                    style="display: none;">
                    Cancel
                </button>

            </div>

        </form>

        <div id="message"></div>

    </section>


    <section class="card">

        <div class="table-header">

            <div>
                <h2>Student Records</h2>
                <p id="studentCount">0 students</p>
            </div>

            <input
                type="text"
                id="searchInput"
                placeholder="Search students..."
                onkeyup="searchStudents()">

        </div>


        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>CGPA</th>
                        <th>Skills</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">

                </tbody>

            </table>

        </div>

        <div id="emptyMessage" class="empty-message">
            No student records found.
        </div>

    </section>

</main>


<footer>
    <p>Student Placement Management System | CRUD Web Application</p>
</footer>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
